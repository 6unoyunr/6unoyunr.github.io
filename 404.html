
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 | Junyoung Park</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Georgia, Cambria, "Times New Roman", serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #252b34;
        background: #f7f4ed;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 3rem;
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.7;
      }

      a {
        color: #0079bc;
        text-underline-offset: 0.2em;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #ebe6da;
          background: #1d1e22;
        }

        a {
          color: #f6ab00;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>요청한 페이지를 찾을 수 없습니다.</p>
      <a href="/">홈으로 돌아가기</a>
    </main>
  </body>
</html>
